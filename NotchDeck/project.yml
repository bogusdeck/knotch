name: NotchDeck
options:
  bundleIdPrefix: com.notchdeck
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Not sandboxed — distributed outside App Store
    ENABLE_APP_SANDBOX: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.2"
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: "0.5.5"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.6"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"

targets:
  NotchDeck:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Window
      - path: Config
      - path: Widgets
      - path: Settings
      - path: Resources
        type: folder
    resources:
      - Resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.notchdeck.app
        PRODUCT_NAME: NotchDeck
    dependencies:
      - package: KeyboardShortcuts
      - package: TOMLKit
      - package: SwiftTerm
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --quiet
          fi
        basedOnDependencyAnalysis: false

  NotchDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.notchdeck.tests
        PRODUCT_NAME: NotchDeckTests
    dependencies:
      - target: NotchDeck
      - package: TOMLKit
      - package: KeyboardShortcuts
