name: Release (Signed & Notarized DMG)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag / Release version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Sign, Notarize & Package DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install Tooling
        run: |
          brew install xcodegen create-dmg

      - name: Generate Xcode Project
        working-directory: NotchDeck
        run: xcodegen generate

      - name: Resolve SPM Dependencies
        working-directory: NotchDeck
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Knotch.xcodeproj \
            -scheme Knotch

      - name: Run Unit Tests
        working-directory: NotchDeck
        run: |
          xcodebuild \
            -project Knotch.xcodeproj \
            -scheme Knotch \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -skipPackagePluginValidation \
            test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Setup Keychain for Code Signing (if certificates provided)
        id: keychain
        run: |
          if [ -n "${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(uuidgen)
            
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            echo "${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/certificate.p12
            security import $RUNNER_TEMP/certificate.p12 \
              -k "$KEYCHAIN_PATH" \
              -P "${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}" \
              -T /usr/bin/codesign

            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            echo "signed=true" >> $GITHUB_OUTPUT
            echo "keychain_path=$KEYCHAIN_PATH" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & Archive
        working-directory: NotchDeck
        run: |
          if [ "${{ steps.keychain.outputs.signed }}" = "true" ]; then
            xcodebuild archive \
              -project Knotch.xcodeproj \
              -scheme Knotch \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/Knotch.xcarchive" \
              -skipPackagePluginValidation \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Developer ID Application: ${{ secrets.DEVELOPER_ID_NAME }}"
          else
            xcodebuild archive \
              -project Knotch.xcodeproj \
              -scheme Knotch \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/Knotch.xcarchive" \
              -skipPackagePluginValidation \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export Application
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/Knotch.xcarchive/Products/Applications/Knotch.app" "$RUNNER_TEMP/export/"

      - name: Notarize App (if Apple credentials provided)
        if: steps.keychain.outputs.signed == 'true' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Knotch.app" "$RUNNER_TEMP/export/Knotch.zip"
          xcrun notarytool submit "$RUNNER_TEMP/export/Knotch.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/Knotch.app"

      - name: Package Artifacts (DMG & ZIP)
        run: |
          mkdir -p release-artifacts
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Knotch.app" "release-artifacts/Knotch.zip"
          create-dmg \
            --volname "Knotch" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Knotch.app" 175 120 \
            --app-drop-link 425 120 \
            --hide-extension "Knotch.app" \
            --no-internet-enable \
            "release-artifacts/Knotch.dmg" \
            "$RUNNER_TEMP/export/Knotch.app" || {
              # Fallback to hdiutil if create-dmg encounters display/finder issues on headless runner
              hdiutil create -volname "Knotch" -srcfolder "$RUNNER_TEMP/export" -ov -format UDZO "release-artifacts/Knotch.dmg"
            }

      - name: Notarize DMG (if signed)
        if: steps.keychain.outputs.signed == 'true' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "release-artifacts/Knotch.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "release-artifacts/Knotch.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Knotch-Release
          path: release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/Knotch.dmg
            release-artifacts/Knotch.zip
          generate_release_notes: true
          draft: false
          prerelease: false
